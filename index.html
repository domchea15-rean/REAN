<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 មេរៀនរបស់ខ្ញុំ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Khmer OS', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 35px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .emoji-big {
            font-size: 70px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 28px;
            color: #2d3748;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #718096;
            font-size: 16px;
            margin-bottom: 30px;
            border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 20px;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .menu a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 20px;
            background: white;
            border-radius: 16px;
            text-decoration: none;
            color: #2d3748;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .menu a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: #667eea;
        }
        .menu a .icon {
            font-size: 28px;
        }
        .menu a .label {
            flex: 1;
            text-align: left;
        }
        .menu a .arrow {
            color: #a0aec0;
            font-size: 20px;
        }
        .footer {
            margin-top: 30px;
            color: #a0aec0;
            font-size: 14px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }
        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji-big">📚</div>
        <h1>មេរៀនរបស់ខ្ញុំ</h1>
        <p class="subtitle">សូមជ្រើសរើសមេរៀនដើម្បីរៀន 👇</p>

        <div class="menu">
            <a href="safety.html">
                <span class="icon">🛡️</span>
                <span class="label">សុវត្ថិភាព</span>
                <span class="arrow">→</span>
            </a>
            <a href="livestock.html">
                <span class="icon">🐄</span>
                <span class="label">ចិញ្ចឹមសត្វ</span>
                <span class="arrow">→</span>
            </a>
            <a href="quiz.html">
                <span class="icon">?</span>
                <span class="label">សំនួរ</span>
                <span class="arrow">→</span>
            <!-- បងប្រុសអាចបន្ថែមមេរៀនថ្មីត្រង់នេះ -->
        </div>

        <div class="footer">
            🌱 បង្កើតដោយ <strong>domchea15</strong> &nbsp;|&nbsp; <span class="badge">GitHub Pages</span>
        </div>
    </div>
</body>
</html>
